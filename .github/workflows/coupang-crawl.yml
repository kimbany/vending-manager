name: 쿠팡 주문 크롤링

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 오전 06:00 KST
  workflow_dispatch:        # 수동 실행

jobs:
  crawl:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 쿠팡 주문 크롤링 실행
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          DISPLAY: ':99'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &>/dev/null &
          sleep 2
          source ~/runner-env3/bin/activate
          python3.11 coupang_crawler.py

      - name: 스크린샷 업로드 (디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupang-screenshots
          path: 'coupang_*.png'
          retention-days: 3
