<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invendory 관리자</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box { background: #fff; border-radius: 16px; padding: 40px 30px; max-width: 360px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; }
  .login-box h2 { font-size: 20px; margin-bottom: 8px; }
  .login-box p { font-size: 13px; color: #888; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; margin-bottom: 12px; text-align: center; }
  .login-box button { width: 100%; padding: 12px; background: #4A7AFF; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .login-box .msg { font-size: 12px; margin-top: 10px; min-height: 18px; }

  #admin-app { display: none; }
  .header { background: #fff; padding: 16px 20px; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .header .actions { display: flex; gap: 8px; }
  .header .actions button { background: #f0f0f0; border: none; border-radius: 8px; padding: 8px 14px; font-size: 12px; cursor: pointer; font-family: inherit; }

  .tabs { display: flex; background: #fff; border-bottom: 1px solid #e8e8e8; }
  .tabs button { flex: 1; padding: 12px; border: none; background: none; font-size: 14px; font-weight: 600; cursor: pointer; color: #888; border-bottom: 2px solid transparent; font-family: inherit; }
  .tabs button.active { color: #4A7AFF; border-bottom-color: #4A7AFF; }

  .panel { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
  .panel.active { display: block; }

  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #e8e8e8; }
  .card h3 { font-size: 14px; margin-bottom: 10px; color: #333; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #f0f0f0; }
  th { font-weight: 600; color: #888; font-size: 11px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: #f8f9ff; border-radius: 10px; padding: 14px; text-align: center; }
  .stat-card .num { font-size: 24px; font-weight: 800; color: #4A7AFF; }
  .stat-card .label { font-size: 11px; color: #888; margin-top: 4px; }

  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-head h3 { margin: 0; }
  .ghost-btn { background: transparent; border: 1px solid #ddd; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; color: #666; font-family: inherit; }
  .ghost-btn:hover { background: #f5f5f5; }
  .count-badge { background: #f0f4ff; color: #4A7AFF; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 700; }

  .notice-card.editing { background: #fff9f0; border-color: #ffd699; }
  .schedule-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .schedule-row input[type="datetime-local"] { width: 100%; padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; font-family: inherit; }
  .notice-form { display: flex; flex-direction: column; gap: 4px; }
  .form-label { font-size: 11px; color: #888; font-weight: 600; margin-top: 4px; }
  .notice-form input[type="text"], .notice-form textarea { width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; font-family: inherit; transition: border-color .15s; }
  .notice-form input[type="text"]:focus, .notice-form textarea:focus { outline: none; border-color: #4A7AFF; }
  .notice-form textarea { min-height: 100px; resize: vertical; }
  .popup-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 10px; background: #f8f9ff; border-radius: 8px; cursor: pointer; margin-top: 4px; }
  .popup-toggle input[type="checkbox"] { cursor: pointer; }
  .primary-btn { background: #4A7AFF; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px; transition: background .15s; }
  .primary-btn:hover { background: #3a6aef; }
  .primary-btn.editing { background: #f59e0b; }
  .primary-btn.editing:hover { background: #d68708; }
  .form-msg { font-size: 12px; min-height: 18px; text-align: center; margin-top: 4px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  .badge-green { background: rgba(122,218,154,.15); color: #2d8a4e; }
  .badge-red { background: rgba(224,88,88,.15); color: #c0392b; }
  .badge-blue { background: rgba(0,100,255,.1); color: #4A7AFF; }

  .notice-item { padding: 14px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 10px; background: #fff; transition: box-shadow .15s, border-color .15s; }
  .notice-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-color: #ddd; }
  .notice-item.is-editing { border-color: #f59e0b; background: #fff9f0; }
  .notice-item .title { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .notice-item .meta { font-size: 11px; color: #999; margin-top: 4px; }
  .notice-item .content { font-size: 13px; color: #444; margin-top: 8px; line-height: 1.55; white-space: pre-wrap; padding: 8px 10px; background: #fafafa; border-radius: 6px; }
  .notice-item .actions { margin-top: 10px; display: flex; gap: 6px; justify-content: flex-end; }
  .notice-item .actions button { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit; color: #555; transition: background .15s, color .15s, border-color .15s; }
  .notice-item .actions button:hover { background: #f5f5f5; }
  .notice-item .actions button.edit:hover { color: #4A7AFF; border-color: #4A7AFF; }
  .notice-item .actions button.del { color: #e05858; }
  .notice-item .actions button.del:hover { background: #fee; border-color: #e05858; }
  .notice-empty { text-align: center; padding: 40px 16px; color: #aaa; font-size: 13px; }
  .notice-empty .icon { font-size: 32px; margin-bottom: 8px; opacity: 0.6; }

  .user-toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }
  .user-toolbar .tb-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .user-toolbar label { font-size: 11px; color: #888; font-weight: 600; }
  .user-toolbar select, .user-toolbar input { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; font-family: inherit; background: #fff; }
  .user-toolbar input { min-width: 160px; }
  .user-toolbar .tb-clear { background: #f0f0f0; border: none; border-radius: 6px; width: 26px; height: 26px; font-size: 14px; cursor: pointer; color: #888; font-family: inherit; }
  .user-toolbar .tb-clear:hover { background: #e8e8e8; color: #333; }

  .pw-change { margin-top: 20px; padding-top: 16px; border-top: 1px solid #e8e8e8; }
  .pw-change input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; margin-bottom: 8px; }
  .pw-change button { background: #555; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div class="login-wrap" id="login-screen">
  <div class="login-box">
    <h2>🔒 관리자 로그인</h2>
    <p>Invendory 관리자 전용 페이지</p>
    <input type="password" id="admin-pw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')adminLogin()">
    <button onclick="adminLogin()">로그인</button>
    <div class="msg" id="login-msg"></div>
  </div>
</div>

<!-- 관리자 앱 -->
<div id="admin-app">
  <div class="header">
    <h1>⚙️ Invendory 관리자</h1>
    <div class="actions">
      <button onclick="switchTab('settings')">⚙️ 설정</button>
      <button onclick="adminLogout()">로그아웃</button>
    </div>
  </div>

  <div class="tabs">
    <button class="active" id="tab-btn-users" onclick="switchTab('users')">👥 사용자</button>
    <button id="tab-btn-notices" onclick="switchTab('notices')">📢 공지사항</button>
    <button id="tab-btn-settings" onclick="switchTab('settings')">⚙️ 설정</button>
  </div>

  <!-- 사용자 관리 -->
  <div class="panel active" id="panel-users">
    <div class="stat-grid" id="user-stats"></div>
    <div class="card">
      <h3>전체 사용자 목록</h3>
      <div class="user-toolbar">
        <div class="tb-group">
          <label>정렬</label>
          <select id="sort-field" onchange="renderUserTable()">
            <option value="lastLogin">마지막 접속</option>
            <option value="name">이름</option>
            <option value="email">이메일</option>
            <option value="createdAt">가입일</option>
          </select>
          <select id="sort-dir" onchange="renderUserTable()">
            <option value="desc">내림차순 ▼</option>
            <option value="asc">오름차순 ▲</option>
          </select>
        </div>
        <div class="tb-group">
          <label>검색</label>
          <select id="search-field" onchange="renderUserTable()">
            <option value="name">이름</option>
            <option value="email">이메일</option>
            <option value="phone">연락처</option>
          </select>
          <input type="text" id="search-input" placeholder="검색어 입력" oninput="renderUserTable()">
          <button class="tb-clear" onclick="clearUserSearch()">×</button>
        </div>
      </div>
      <div id="user-list" style="overflow-x:auto"></div>
    </div>
  </div>

  <!-- 공지사항 관리 -->
  <div class="panel" id="panel-notices">
    <div class="card notice-card">
      <div class="card-head">
        <h3 id="notice-form-title">📝 새 공지사항 작성</h3>
        <button id="notice-cancel-btn" class="ghost-btn" style="display:none" onclick="cancelEditNotice()">✕ 취소</button>
      </div>
      <div class="notice-form">
        <label class="form-label">제목</label>
        <input type="text" id="notice-title" placeholder="공지 제목을 입력하세요" maxlength="60">
        <label class="form-label">내용</label>
        <textarea id="notice-content" placeholder="공지 내용을 입력하세요"></textarea>
        <div class="schedule-row">
          <div>
            <label class="form-label">시작 일시 <span style="color:#aaa;font-weight:400">(선택)</span></label>
            <input type="datetime-local" id="notice-start">
          </div>
          <div>
            <label class="form-label">종료 일시 <span style="color:#aaa;font-weight:400">(선택)</span></label>
            <input type="datetime-local" id="notice-end">
          </div>
        </div>
        <div style="font-size:11px;color:#888;margin:-4px 0 4px 2px">
          비워두면 등록 즉시부터 무기한 표시됩니다. 종료 일시가 지나면 사용자에게 자동으로 안 보이게 돼요.
        </div>
        <label class="popup-toggle">
          <input type="checkbox" id="notice-popup">
          <span>📢 팝업 공지로 설정 <span style="color:#888;font-weight:400;font-size:11px">(앱 첫 화면에 띄워요)</span></span>
        </label>
        <button id="notice-save-btn" class="primary-btn" onclick="saveNotice()">공지 등록</button>
        <div id="notice-form-msg" class="form-msg"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <h3>📋 등록된 공지사항</h3>
        <span id="notice-count" class="count-badge"></span>
      </div>
      <div id="notice-list"></div>
    </div>
  </div>

  <!-- 설정 -->
  <div class="panel" id="panel-settings">
    <div class="card">
      <h3>🔑 비밀번호 변경</h3>
      <div class="pw-change">
        <input type="password" id="pw-current" placeholder="현재 비밀번호">
        <input type="password" id="pw-new" placeholder="새 비밀번호">
        <input type="password" id="pw-new2" placeholder="새 비밀번호 확인">
        <button onclick="changePassword()">비밀번호 변경</button>
        <div class="msg" id="pw-msg" style="margin-top:8px"></div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDUx_Kf-jxjjmaBGkhwkPE_cpmBSPNjNdE",
  authDomain: "vending-manager-2d64e.firebaseapp.com",
  databaseURL: "https://vending-manager-2d64e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vending-manager-2d64e"
});
var db = firebase.database();
var ADMIN_REF = db.ref('adminConfig');

// notices 등 auth 필요한 경로를 읽기 위해 익명 로그인 (실패해도 진행)
var _firebaseAuthReady = false;
firebase.auth().onAuthStateChanged(function(u){
  if(u){
    _firebaseAuthReady = true;
    // 관리자가 이미 로그인 상태라면 공지를 다시 로드 (rule이 풀리는 시점)
    if(sessionStorage.getItem('adminAuth') &&
       document.getElementById('admin-app').style.display !== 'none'){
      loadNotices();
    }
  }
});
firebase.auth().signInAnonymously().catch(function(e){
  console.warn('익명 로그인 실패 (notices 읽기에 필요할 수 있음):', e.code, e.message);
});

// ─── 로그인 ──────────────────────────────────────────────────────────────────
function adminLogin(){
  var pw = document.getElementById('admin-pw').value;
  var msg = document.getElementById('login-msg');
  if(!pw){ msg.style.color='#e05858'; msg.textContent='비밀번호를 입력하세요'; return; }

  ADMIN_REF.child('password').once('value').then(function(snap){
    var savedPw = snap.val();
    // 초기 비밀번호 설정 (최초 접속)
    if(!savedPw){
      ADMIN_REF.child('password').set('1234');
      savedPw = '1234';
    }
    if(pw === savedPw){
      sessionStorage.setItem('adminAuth', 'true');
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-app').style.display = 'block';
      loadUsers();
      loadNotices();
    } else {
      msg.style.color='#e05858'; msg.textContent='비밀번호가 틀립니다';
    }
  });
}

function adminLogout(){
  sessionStorage.removeItem('adminAuth');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-app').style.display = 'none';
}

// 세션 유지
if(sessionStorage.getItem('adminAuth')){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-app').style.display = 'block';
  setTimeout(function(){ loadUsers(); loadNotices(); }, 500);
}

// ─── 탭 전환 ─────────────────────────────────────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('panel-'+tab).classList.add('active');
  var btn = document.getElementById('tab-btn-'+tab);
  if(btn) btn.classList.add('active');
}

// ─── 사용자 관리 ─────────────────────────────────────────────────────────────
var _userList = [];

// UTC ISO → KST 한국시간 표시
function toKstDateTime(iso){
  if(!iso) return '-';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return iso.slice(0,16).replace('T',' ');
  var kst = new Date(d.getTime() + 9*3600000);
  return kst.toISOString().slice(0,16).replace('T',' ');
}
function toKstDate(iso){
  if(!iso) return '-';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return iso.slice(0,10);
  var kst = new Date(d.getTime() + 9*3600000);
  return kst.toISOString().slice(0,10);
}

function loadUsers(){
  db.ref('adminUsers').once('value').then(function(snap){
    var users = snap.val() || {};
    _userList = [];

    Object.keys(users).forEach(function(uid){
      var u = users[uid];
      if(!u || typeof u !== 'object') return;
      _userList.push({
        uid: uid,
        name: u.name || '',
        email: u.email || '',
        phone: u.phone || '',
        createdAt: u.createdAt || '',
        lastLogin: u.lastLogin || '',
        machines: Array.isArray(u.machines) ? u.machines : [],
        machineCount: typeof u.machineCount === 'number' ? u.machineCount : (Array.isArray(u.machines) ? u.machines.length : 0)
      });
    });

    // 통계
    var totalMachines = _userList.reduce(function(s,u){ return s + (u.machineCount||0); }, 0);
    document.getElementById('user-stats').innerHTML =
      '<div class="stat-card"><div class="num">'+_userList.length+'</div><div class="label">전체 사용자</div></div>'+
      '<div class="stat-card"><div class="num">'+totalMachines+'</div><div class="label">전체 자판기</div></div>';

    renderUserTable();
  });
}

function clearUserSearch(){
  document.getElementById('search-input').value = '';
  renderUserTable();
}

function renderUserTable(){
  var list = _userList.slice();

  // 검색 필터
  var sf = document.getElementById('search-field');
  var si = document.getElementById('search-input');
  var searchField = sf ? sf.value : 'name';
  var searchTerm = (si ? si.value : '').trim().toLowerCase();
  if(searchTerm){
    list = list.filter(function(u){
      var v = (u[searchField] || '').toString().toLowerCase();
      return v.indexOf(searchTerm) >= 0;
    });
  }

  // 정렬
  var sortField = (document.getElementById('sort-field')||{}).value || 'lastLogin';
  var sortDir = (document.getElementById('sort-dir')||{}).value || 'desc';
  var dirMul = sortDir === 'asc' ? 1 : -1;
  list.sort(function(a,b){
    var av = (a[sortField] || '').toString();
    var bv = (b[sortField] || '').toString();
    if(sortField === 'name' || sortField === 'email'){
      return av.localeCompare(bv, 'ko') * dirMul;
    }
    return av.localeCompare(bv) * dirMul;
  });

  // 테이블
  var html = '<table><thead><tr><th></th><th>이름</th><th>이메일</th><th>연락처</th><th>자판기</th><th>가입일</th><th>마지막 접속</th></tr></thead><tbody>';
  list.forEach(function(u, idx){
    html += '<tr onclick="toggleUserDetail('+idx+')" style="cursor:pointer">'+
      '<td style="width:20px;color:#888" id="user-arrow-'+idx+'">▶</td>'+
      '<td style="font-weight:600;color:#4A7AFF">'+(u.name||'-')+'</td>'+
      '<td>'+(u.email||'-')+'</td>'+
      '<td>'+(u.phone||'-')+'</td>'+
      '<td>'+(u.machineCount||0)+'대</td>'+
      '<td>'+toKstDate(u.createdAt)+'</td>'+
      '<td>'+toKstDateTime(u.lastLogin)+'</td>'+
    '</tr>';
    // 자판기 상세 (숨김)
    html += '<tr id="user-detail-'+idx+'" style="display:none"><td colspan="7" style="padding:12px;background:#f8f9ff">';
    var machines = u.machines || [];
    if(machines.length){
      html += '<div style="font-size:12px;font-weight:700;margin-bottom:8px">🏪 자판기 현황 ('+machines.length+'대)</div>';
      var byLoc = {};
      machines.forEach(function(m){
        var key = m.locationName || '-';
        if(!byLoc[key]) byLoc[key] = [];
        byLoc[key].push(m);
      });
      Object.keys(byLoc).forEach(function(locName){
        html += '<div style="margin-top:8px;padding:8px;background:#fff;border-radius:8px;border:1px solid #eee">'+
          '<div style="font-size:12px;font-weight:700;color:#4A7AFF;margin-bottom:6px">📍 '+locName+' <span style="color:#888;font-weight:400">('+byLoc[locName].length+'대)</span></div>';
        byLoc[locName].forEach(function(m){
          var meta = [];
          if(m.deviceNos) meta.push('단말기: '+m.deviceNos);
          if(m.productSources && m.productSources !== 'none') meta.push('출처: '+m.productSources);
          html += '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">'+
            '<div><strong>'+m.machineName+'</strong>'+(m.model?' <span style="color:#888">· '+m.model+'</span>':'')+
              (meta.length?'<div style="font-size:10px;color:#aaa;margin-top:2px">'+meta.join(' · ')+'</div>':'')+
            '</div>'+
            '<div style="color:#4A7AFF;font-weight:600">'+(m.productCount||0)+'개 제품</div>'+
          '</div>';
        });
        html += '</div>';
      });
    } else {
      html += '<div style="font-size:12px;color:#888">등록된 자판기가 없거나, 사용자가 아직 최신 앱으로 로그인하지 않았어요.<br>'+
              '사용자가 앱에 접속하면 자동으로 갱신됩니다.</div>';
    }
    html += '</td></tr>';
  });
  html += '</tbody></table>';

  if(!list.length){
    html = !_userList.length
      ? '<div style="text-align:center;padding:20px;color:#888;font-size:13px">사용자가 앱에 로그인하면 여기에 표시됩니다</div>'
      : '<div style="text-align:center;padding:20px;color:#888;font-size:13px">검색 결과가 없습니다</div>';
  }
  document.getElementById('user-list').innerHTML = html;
}

function toggleUserDetail(idx){
  var row = document.getElementById('user-detail-'+idx);
  var arrow = document.getElementById('user-arrow-'+idx);
  if(!row) return;
  var open = row.style.display === 'none';
  row.style.display = open ? '' : 'none';
  if(arrow) arrow.textContent = open ? '▼' : '▶';
}

// ─── 공지사항 관리 ───────────────────────────────────────────────────────────
var _editingNoticeId = null;

function loadNotices(){
  var listEl = document.getElementById('notice-list');
  var countEl = document.getElementById('notice-count');
  db.ref('notices').orderByChild('createdAt').once('value').then(function(snap){
    var notices = [];
    snap.forEach(function(child){
      var n = child.val() || {};
      n._id = child.key;
      notices.push(n);
    });
    notices.reverse();

    if(countEl) countEl.textContent = notices.length ? notices.length+'건' : '';

    if(!notices.length){
      listEl.innerHTML = '<div class="notice-empty"><div class="icon">📭</div>등록된 공지사항이 없습니다<br><span style="font-size:11px">위에서 첫 공지를 작성해보세요</span></div>';
      return;
    }

    var nowMs = Date.now();
    listEl.innerHTML = notices.map(function(n){
      var editing = _editingNoticeId === n._id;
      var title = (n.title||'').replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; });
      var content = (n.content||'').replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; });
      var statusBadge = '';
      var schedMeta = '';
      var startMs = n.startAt ? new Date(n.startAt).getTime() : null;
      var endMs = n.endAt ? new Date(n.endAt).getTime() : null;
      if(startMs && nowMs < startMs){
        statusBadge = '<span class="badge" style="background:#fff4e0;color:#a06200">예약</span>';
      } else if(endMs && nowMs > endMs){
        statusBadge = '<span class="badge" style="background:#f0f0f0;color:#888">종료</span>';
      } else {
        statusBadge = '<span class="badge badge-green">노출 중</span>';
      }
      if(n.startAt || n.endAt){
        schedMeta = '<div class="meta">📅 '+
          (n.startAt ? toKstDateTime(n.startAt) : '즉시')+
          ' ~ '+(n.endAt ? toKstDateTime(n.endAt) : '무기한')+
        '</div>';
      }
      return '<div class="notice-item'+(editing?' is-editing':'')+'">'+
        '<div class="title">'+title+
          (n.popup?' <span class="badge badge-red">📢 팝업</span>':'')+
          ' '+statusBadge+
          (editing?' <span class="badge badge-blue">수정 중</span>':'')+
        '</div>'+
        '<div class="meta">🕒 등록: '+toKstDateTime(n.createdAt)+
          (n.updatedAt ? ' · 수정: '+toKstDateTime(n.updatedAt) : '')+
        '</div>'+
        schedMeta+
        '<div class="content">'+content+'</div>'+
        '<div class="actions">'+
          '<button class="edit" onclick="editNotice(\''+n._id+'\')">✏️ 수정</button>'+
          '<button class="del" onclick="deleteNotice(\''+n._id+'\',\''+title.replace(/'/g,"\\'")+'\')">🗑 삭제</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }).catch(function(e){
    listEl.innerHTML = '<div class="notice-empty"><div class="icon">⚠️</div>공지 목록을 읽지 못했어요<br><span style="font-size:11px">'+(e.message||e.code||'')+'</span></div>';
  });
}

function showNoticeMsg(text, color){
  var el = document.getElementById('notice-form-msg');
  if(!el) return;
  el.style.color = color || '#2d8a4e';
  el.textContent = text;
  if(text){ setTimeout(function(){ if(el.textContent === text) el.textContent = ''; }, 2500); }
}

// datetime-local 입력값(브라우저 로컬=KST 가정) → UTC ISO로 저장
function localToIso(localStr){
  if(!localStr) return '';
  var d = new Date(localStr);
  return isNaN(d.getTime()) ? '' : d.toISOString();
}
// 저장된 ISO → datetime-local 표시값(YYYY-MM-DDTHH:mm)
function isoToLocalInput(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  // 로컬 타임존 보정
  var tz = d.getTimezoneOffset();
  return new Date(d.getTime() - tz*60000).toISOString().slice(0,16);
}

function saveNotice(){
  var title = document.getElementById('notice-title').value.trim();
  var content = document.getElementById('notice-content').value.trim();
  var popup = document.getElementById('notice-popup').checked;
  var startLocal = document.getElementById('notice-start').value;
  var endLocal = document.getElementById('notice-end').value;
  if(!title || !content){ showNoticeMsg('제목과 내용을 모두 입력하세요', '#e05858'); return; }

  var startIso = localToIso(startLocal);
  var endIso = localToIso(endLocal);
  if(startIso && endIso && new Date(endIso).getTime() <= new Date(startIso).getTime()){
    showNoticeMsg('종료 일시는 시작 일시 이후여야 해요', '#e05858'); return;
  }

  var nowIso = new Date().toISOString();
  var editId = _editingNoticeId;
  var data = {
    title: title, content: content, popup: popup,
    startAt: startIso || null, endAt: endIso || null
  };

  if(editId){
    data.updatedAt = nowIso;
    db.ref('notices/'+editId).update(data)
      .then(function(){ showNoticeMsg('✅ 수정 완료'); clearNoticeForm(); loadNotices(); })
      .catch(function(e){ showNoticeMsg('수정 실패: '+(e.message||e.code), '#e05858'); });
  } else {
    data.createdAt = nowIso;
    db.ref('notices').push(data)
      .then(function(){ showNoticeMsg('✅ 등록 완료'); clearNoticeForm(); loadNotices(); })
      .catch(function(e){ showNoticeMsg('등록 실패: '+(e.message||e.code), '#e05858'); });
  }
}

function editNotice(id){
  db.ref('notices/'+id).once('value').then(function(snap){
    var n = snap.val();
    if(!n) return;
    _editingNoticeId = id;
    document.getElementById('notice-title').value = n.title || '';
    document.getElementById('notice-content').value = n.content || '';
    document.getElementById('notice-popup').checked = !!n.popup;
    document.getElementById('notice-start').value = isoToLocalInput(n.startAt);
    document.getElementById('notice-end').value = isoToLocalInput(n.endAt);
    document.getElementById('notice-form-title').textContent = '✏️ 공지사항 수정';
    document.getElementById('notice-cancel-btn').style.display = '';
    var btn = document.getElementById('notice-save-btn');
    btn.textContent = '수정 완료';
    btn.classList.add('editing');
    document.querySelector('.notice-card').classList.add('editing');
    document.querySelector('.notice-card').scrollIntoView({behavior:'smooth', block:'start'});
    loadNotices();
  });
}

function cancelEditNotice(){
  clearNoticeForm();
  loadNotices();
}

function deleteNotice(id, title){
  if(!confirm('"'+title+'" 공지를 삭제할까요?')) return;
  db.ref('notices/'+id).remove().then(function(){
    if(_editingNoticeId === id) clearNoticeForm();
    showNoticeMsg('🗑 삭제 완료');
    loadNotices();
  }).catch(function(e){ showNoticeMsg('삭제 실패: '+(e.message||e.code), '#e05858'); });
}

function clearNoticeForm(){
  _editingNoticeId = null;
  document.getElementById('notice-title').value = '';
  document.getElementById('notice-content').value = '';
  document.getElementById('notice-popup').checked = false;
  document.getElementById('notice-start').value = '';
  document.getElementById('notice-end').value = '';
  document.getElementById('notice-form-title').textContent = '📝 새 공지사항 작성';
  document.getElementById('notice-cancel-btn').style.display = 'none';
  var btn = document.getElementById('notice-save-btn');
  btn.textContent = '공지 등록';
  btn.classList.remove('editing');
  var card = document.querySelector('.notice-card');
  if(card) card.classList.remove('editing');
}

// ─── 비밀번호 변경 ───────────────────────────────────────────────────────────
function changePassword(){
  var current = document.getElementById('pw-current').value;
  var newPw = document.getElementById('pw-new').value;
  var newPw2 = document.getElementById('pw-new2').value;
  var msg = document.getElementById('pw-msg');

  if(!current || !newPw){ msg.style.color='#e05858'; msg.textContent='모든 필드를 입력하세요'; return; }
  if(newPw !== newPw2){ msg.style.color='#e05858'; msg.textContent='새 비밀번호가 일치하지 않습니다'; return; }
  if(newPw.length < 4){ msg.style.color='#e05858'; msg.textContent='비밀번호는 4자 이상이어야 합니다'; return; }

  ADMIN_REF.child('password').once('value').then(function(snap){
    if(snap.val() !== current){
      msg.style.color='#e05858'; msg.textContent='현재 비밀번호가 틀립니다';
      return;
    }
    ADMIN_REF.child('password').set(newPw).then(function(){
      msg.style.color='#2d8a4e'; msg.textContent='✅ 비밀번호 변경 완료';
      document.getElementById('pw-current').value = '';
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-new2').value = '';
    });
  });
}
</script>
