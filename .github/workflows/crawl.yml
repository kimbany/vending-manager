name: VMMS 거래내역 자동 수집

on:
  schedule:
    # 한국시간 12:00 = UTC 03:00
    - cron: '0 3 * * *'
    # 한국시간 19:00 = UTC 10:00
    - cron: '0 10 * * *'
  # 수동 실행 버튼 (GitHub Actions 탭에서 직접 실행 가능)
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install playwright firebase-admin
          playwright install chromium
          playwright install-deps chromium

      - name: 크롤링 실행
        env:
          VMMS_ID: ${{ secrets.VMMS_ID }}
          VMMS_PW: ${{ secrets.VMMS_PW }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python vmms_crawler.py
