name: 쿠팡 주문 크롤링

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 오전 06:00 KST
  workflow_dispatch:        # 수동 실행

jobs:
  crawl:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Xvfb 시작 + 쿠팡 크롤링
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          pkill -f Xvfb || true
          pkill -f chrome || true
          pkill -f chromium || true
          sleep 1
          Xvfb :99 -screen 0 1280x800x24 -ac &
          sleep 3
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY"
          xdpyinfo -display :99 | head -2 || echo "xdpyinfo failed"
          free -m
          source ~/runner-env3/bin/activate
          which python3.11
          which google-chrome
          python3.11 coupang_crawler.py

      - name: 스크린샷 업로드 (디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupang-screenshots
          path: 'coupang_*.png'
          retention-days: 3
