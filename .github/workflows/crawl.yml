name: VMMS 자동 크롤링

on:
  schedule:
    # 한국시간 기준 (UTC+9)
    - cron: '0 3 * * *'   # 매일 오후 12:00 KST
    - cron: '0 10 * * *'  # 매일 오후 19:00 KST
  workflow_dispatch:       # 수동 실행 버튼
    inputs:
      crawl_date:
        description: '크롤링 날짜 (YYYY-MM-DD, 비워두면 오늘)'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install playwright firebase-admin cryptography
          playwright install chromium
          playwright install-deps chromium

      - name: VMMS 크롤링 실행
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          VMMS_ID: ${{ secrets.VMMS_ID }}
          VMMS_PW: ${{ secrets.VMMS_PW }}
          CRAWL_DATE: ${{ github.event.inputs.crawl_date }}
        run: python vmms_crawler.py

      - name: 스크린샷 업로드 (디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          retention-days: 3
