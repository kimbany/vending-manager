name: VMMS 자동 크롤링

on:
  schedule:
    # 한국시간 기준 (UTC+9)
    - cron: '0 0 * * *'   # 매일 오전 09:00 KST
    - cron: '0 6 * * *'   # 매일 오후 03:00 KST
    - cron: '0 9 * * *'   # 매일 오후 06:00 KST
  workflow_dispatch:       # 수동 실행 버튼

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install playwright firebase-admin
          playwright install chromium
          playwright install-deps chromium

      - name: VMMS 크롤링 실행
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          VMMS_ID: ${{ secrets.VMMS_ID }}
          VMMS_PW: ${{ secrets.VMMS_PW }}
        run: python vmms_crawler.py

      - name: 스크린샷 업로드 (디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          retention-days: 3
